apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
generatorOptions:
  disableNameSuffixHash: true
resources:
  - folders.yaml
  - dashboards.yaml
configMapGenerator:
  - name: dashboard-altinn-uptime-status-up
    files:
      - altinn-uptime/status-up.json
  - name: dashboard-altinn-uptime-sla-service-owners
    files:
      - altinn-uptime/sla-service-owners.json
  - name: dashboard-altinn-uptime-sla-altinn-product
    files:
      - altinn-uptime/sla-altinn-product.json
  - name: dashboard-altinn-uptime-endpoint-statistics
    files:
      - altinn-uptime/endpoint-statistics.json
  - name: dashboard-dis-edge-envoy-clusters
    files:
      - dis-edge/envoy-clusters.json
  - name: dashboard-dis-edge-envoy-global
    files:
      - dis-edge/envoy-global.json
  - name: dashboard-dis-edge-envoy-ratelimit
    files:
      - dis-edge/envoy-ratelimit.json
  - name: dashboard-dis-edge-envoy-resource-mon
    files:
      - dis-edge/envoy-resource-mon.json
  - name: dashboard-dis-edge-sla-envoy-gateway-edge
    files:
      - dis-edge/sla-envoy-gateway-edge.json
  - name: dashboard-fluxcd-flux-cluster-stats
    files:
      - fluxcd/flux-cluster-stats.json
  - name: dashboard-fluxcd-flux-control-plane
    files:
      - fluxcd/flux-control-plane.json
  - name: dashboard-fluxcd-gitops-flux-application-deployments-dashboard
    files:
      - fluxcd/gitops-flux-application-deployments-dashboard.json
  - name: dashboard-kubernetes-events
    files:
      - kubernetes/events.json
  - name: dashboard-dis-core-linkerd-deployment
    files:
      - dis-core/linkerd-deployment.json
  - name: dashboard-dis-core-product-versions
    files:
      - dis-core/product-versions.json
  - name: dashboard-dis-core-publicip
    files:
      - dis-core/publicip.json
  - name: dashboard-dis-core-traefik-official
    files:
      - dis-core/traefik-official.json
