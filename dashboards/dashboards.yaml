apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  # Name kept from the Altinn folder: renaming the CR would make the operator
  # delete the dashboard (same UID) when Flux prunes the old CR.
  name: external-grafana-altinn-publicip
  namespace: grafana
spec:
  folderRef: external-grafana-dis-core
  instanceSelector:
    matchLabels:
      dashboards: "external-grafana"
  configMapRef:
    name: dashboard-dis-core-publicip
    key: publicip.json
---
