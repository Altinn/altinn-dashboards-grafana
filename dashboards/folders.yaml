apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: external-grafana-altinn
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: "external-grafana"
  title: Altinn
  permissions: |
    {
      "items": [
        { "role": "Admin",  "permission": 4 },
        { "role": "Editor", "permission": 1 },
        { "role": "Viewer", "permission": 1 }
      ]
    }
---
