# Dashboards shared publicly from the grafana-public instance (dashboards.altinn.cloud,
# gitops-manifests oci/grafana-public). The JSON under dashboards/ is generated by
# scripts/build-public-dashboards.py from the platform dashboards; do not edit it by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
generatorOptions:
  disableNameSuffixHash: true
resources:
  - folders.yaml
  - dashboards.yaml
configMapGenerator:
  - name: public-dashboard-altinn-uptime-sla-altinn-product
    files:
      - dashboards/altinn-uptime/sla-altinn-product.json
  - name: public-dashboard-altinn-uptime-sla-service-owners
    files:
      - dashboards/altinn-uptime/sla-service-owners.json
