apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: public-grafana-altinn-uptime
  namespace: grafana
spec:
  # The grafana-public instance runs in the grafana-public namespace.
  allowCrossNamespaceImport: true
  # grafana-public runs on ephemeral storage and comes back empty after a restart;
  # the operator does not notice and only re-adds content on resync (default 10m).
  resyncPeriod: 1m
  instanceSelector:
    matchLabels:
      dashboards: "public-grafana"
  title: Altinn Uptime
