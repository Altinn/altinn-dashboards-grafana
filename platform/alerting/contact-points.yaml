# Platform team alerts. The operator injects the Slack webhook from the grafana-slack-webhooks
# Secret (key `platform`); the URL never belongs in Git.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: platform-slack
  namespace: grafana
spec:
  name: Platform Slack
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  resyncPeriod: 10m0s
  receivers:
    - type: slack
      disableResolveMessage: false
      settings:
        title: 'Platform alert - {{ .Status }}{{ with .CommonLabels.Env }} - {{ . }}{{ end }}'
        # Grafana's own DatasourceError and DatasourceNoData alerts have no summary.
        text: |
          {{ range .Alerts }}{{ .Labels.alertname }} - {{ .Status }}
          {{ if or (eq .Labels.alertname "DatasourceNoData") (eq .Labels.alertname "DatasourceError") }}Grafana could not evaluate {{ .Labels.rulename }}.
          {{ else if eq .Status "firing" }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ else }}{{ with .Annotations.resolution }}{{ . }}{{ else }}The alert condition cleared.{{ end }}
          {{ end }}{{ with .GeneratorURL }}<{{ . }}|Open alert rule>{{ end }}
          {{ end }}
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: grafana-slack-webhooks
              key: platform
