apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-slack-webhooks
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: grafana-alerting-secret-store
    kind: SecretStore
  target:
    name: grafana-slack-webhooks
    creationPolicy: Owner
  data:
    - secretKey: dialogporten
      remoteRef:
        key: slack-webhook-dialogporten
