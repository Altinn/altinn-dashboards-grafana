apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-slack-webhooks
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: grafana-alerting-secret-store
    kind: SecretStore
  target:
    name: grafana-slack-webhooks
    creationPolicy: Owner
  data:
    - secretKey: dialogporten
      remoteRef:
        key: slack-webhook-dialogporten
    - secretKey: infoportal
      remoteRef:
        key: slack-webhook-infoportal-prod
    - secretKey: ki-norge
      remoteRef:
        key: slack-webhook-ki-norge-prod
    # KI Norge's webhook into the shared cross-product #altinn-alerts-prod-critical channel.
    # Per-product webhook, not one shared one — same convention infoportal uses (PR #16).
    - secretKey: ki-norge-critical
      remoteRef:
        key: slack-webhook-ki-norge-altinn-alerts-prod-critical
