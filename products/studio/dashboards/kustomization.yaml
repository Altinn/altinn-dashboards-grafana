apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
generatorOptions:
  # The GrafanaDashboard CRs reference the ConfigMaps by name, so the names must be stable.
  disableNameSuffixHash: true
resources:
  - pdf3.yaml
  - observability-overview.yaml
  - designer.yaml
  - workflow-engine.yaml
  - reports-and-alerts.yaml
  - operator.yaml
  - gateway.yaml
configMapGenerator:
  - name: dashboard-studio-pdf3
    files:
      - pdf3.json
  - name: dashboard-studio-observability-overview
    files:
      - observability-overview.json
  - name: dashboard-studio-designer
    files:
      - designer.json
  - name: dashboard-studio-workflow-engine
    files:
      - workflow-engine.json
  - name: dashboard-studio-reports-and-alerts
    files:
      - reports-and-alerts.json
  - name: dashboard-studio-operator
    files:
      - operator.json
  - name: dashboard-studio-gateway
    files:
      - gateway.json
