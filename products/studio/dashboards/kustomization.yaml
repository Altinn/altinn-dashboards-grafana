apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
generatorOptions:
  # The GrafanaDashboard CRs reference the ConfigMaps by name, so the names must be stable.
  disableNameSuffixHash: true
resources:
  - pdf3.yaml
  - observability-overview.yaml
  - observability-vmsingle.yaml
  - observability-vmagent.yaml
  - observability-operator.yaml
  - observability-vlsingle.yaml
  - observability-vlagent.yaml
  - observability-vtsingle.yaml
configMapGenerator:
  - name: dashboard-studio-pdf3
    files:
      - pdf3.json
  - name: dashboard-studio-observability-overview
    files:
      - observability-overview.json
  - name: dashboard-studio-observability-vmsingle
    files:
      - observability-vmsingle.json
  - name: dashboard-studio-observability-vmagent
    files:
      - observability-vmagent.json
  - name: dashboard-studio-observability-operator
    files:
      - observability-operator.json
  - name: dashboard-studio-observability-vlsingle
    files:
      - observability-vlsingle.json
  - name: dashboard-studio-observability-vlagent
    files:
      - observability-vlagent.json
  - name: dashboard-studio-observability-vtsingle
    files:
      - observability-vtsingle.json
