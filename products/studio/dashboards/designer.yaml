# Errors and slow requests in Altinn Studio Designer, from its traces. Lands in the Altinn Studio
# folder (external-grafana-studio, defined in ../alerting/folder.yaml).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-grafana-studio-designer
  namespace: grafana
spec:
  folderRef: external-grafana-studio
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  configMapRef:
    name: dashboard-studio-designer
    key: designer.json
