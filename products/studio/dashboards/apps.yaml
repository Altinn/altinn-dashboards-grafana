# The service owners' apps: how many there are, deployed and running, and how many are created and
# deployed. Lands in the Altinn Studio folder (external-grafana-studio, defined in
# ../alerting/folder.yaml).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-grafana-studio-apps
  namespace: grafana
spec:
  folderRef: external-grafana-studio
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  configMapRef:
    name: dashboard-studio-apps
    key: apps.json
