# VictoriaMetrics' official dashboard for vmagent (the metrics agent and vmagent-self),
# vendored by ../scripts/vendor-victoria-dashboards.py.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-grafana-studio-observability-vmagent
  namespace: grafana
spec:
  folderRef: external-grafana-studio-observability
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  configMapRef:
    name: dashboard-studio-observability-vmagent
    key: observability-vmagent.json
