# VictoriaMetrics' official dashboard for the VictoriaMetrics operator, vendored by
# ../scripts/vendor-victoria-dashboards.py.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-grafana-studio-observability-operator
  namespace: grafana
spec:
  folderRef: external-grafana-studio-observability
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  configMapRef:
    name: dashboard-studio-observability-operator
    key: observability-operator.json
