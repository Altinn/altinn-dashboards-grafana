# The platform Slack bot posts to #team-altinnstudio-alerts-critical.
# The operator injects its webhook from the shared Secret; the URL never belongs in Git.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: studio-slack-critical
  namespace: grafana
spec:
  name: Studio Slack Critical
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  resyncPeriod: 10m0s
  receivers:
    - type: slack
      disableResolveMessage: false
      settings:
        # Names the alert, and for DatasourceError/DatasourceNoData the rule that failed.
        title: '{{ with .CommonLabels.alertname }}{{ . }}{{ else }}Studio alerts{{ end }}{{ with .CommonLabels.rulename }}: {{ . }}{{ end }}{{ if gt (len .Alerts) 1 }} ({{ len .Alerts }}){{ end }} — {{ .Status }}{{ with .CommonLabels.Env }} ({{ . }}){{ end }}'
        # Predefined tests have no rule UID and supply dummy link targets.
        # DatasourceError and DatasourceNoData replace the rule's own name and annotations, so they say
        # what failed and where to start instead.
        text: |
          {{ range .Alerts }}*{{ .Labels.alertname }}* — {{ .Status }}
          {{ if or (eq .Labels.alertname "DatasourceNoData") (eq .Labels.alertname "DatasourceError") }}Grafana could not evaluate {{ .Labels.rulename }} against datasource {{ .Labels.datasource_uid }}{{ if eq .Labels.alertname "DatasourceNoData" }}: the query returned no data{{ end }}. The rule cannot alert while this lasts.
          {{ with .Annotations.Error }}Error: {{ . }}
          {{ end }}{{ if eq .Status "firing" }}First action: check that observability-proxy and vmsingle-metrics-a/b in the observability namespace are running and that the datasource answers in Grafana Explore.
          {{ end }}{{ else }}{{ .Annotations.summary }}
          {{ if eq .Status "resolved" }}{{ with .Annotations.grafana_state_reason }}Grafana resolved this alert with reason {{ . }}. Recovery is not confirmed.
          {{ else }}{{ with .Annotations.resolution }}{{ . }}{{ else }}The alert condition cleared.{{ end }}
          {{ end }}
          {{ else }}{{ .Annotations.description }}
          {{ with .Annotations.Error }}Query error: {{ . }}
          {{ end }}{{ end }}{{ end }}{{ if .RuleUID }}{{ with .PanelURL }}<{{ . }}|Open Observability panel>{{ end }}
          {{ with .GeneratorURL }}<{{ . }}|Open alert rule>{{ end }}
          {{ end }}
          {{ end }}
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: grafana-slack-webhooks
              key: altinnstudio-alerts-critical
