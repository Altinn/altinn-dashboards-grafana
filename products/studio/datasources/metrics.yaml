apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: altinn-studio-metrics
  namespace: grafana
spec:
  uid: altinn-studio-metrics
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  datasource:
    name: altinn-studio-metrics
    type: prometheus
    access: proxy
    url: https://altinn.studio/internal/observability/metrics
    isDefault: false
    editable: false
    jsonData:
      httpHeaderName1: Authorization
      # Services export metrics every 15 s, so $__rate_interval spans at least four samples.
      timeInterval: 15s
    secureJsonData:
      httpHeaderValue1: "${authorization}"
  valuesFrom:
    - targetPath: secureJsonData.httpHeaderValue1
      valueFrom:
        secretKeyRef:
          name: altinn-studio-metrics-auth
          key: authorization
