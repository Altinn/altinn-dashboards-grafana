apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: altinn-studio-traces-logsql
  namespace: grafana
spec:
  uid: altinn-studio-traces-logsql
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  datasource:
    name: altinn-studio-traces-logsql
    # VictoriaTraces' LogsQL API over the same spans as altinn-studio-traces, one row of fields
    # per span: name, duration, kind, trace_id, resource_attr:service.name, span_attr:http.route
    # and so on. For span tables with any attributes as columns, and stats by any attribute.
    type: victoriametrics-logs-datasource
    access: proxy
    url: https://altinn.studio/internal/observability/traces-logsql
    isDefault: false
    editable: false
    jsonData:
      httpHeaderName1: Authorization
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: altinn-studio-traces
          url: '${__value.raw}'
          urlDisplayLabel: View trace
    secureJsonData:
      httpHeaderValue1: "${authorization}"
  valuesFrom:
    - targetPath: secureJsonData.httpHeaderValue1
      valueFrom:
        secretKeyRef:
          name: altinn-studio-traces-logsql-auth
          key: authorization
