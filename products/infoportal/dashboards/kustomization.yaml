apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
generatorOptions:
  # The GrafanaDashboard CR references the ConfigMap by name, so the name must be stable.
  disableNameSuffixHash: true
resources:
  - dashboard.yaml
configMapGenerator:
  - name: dashboard-infoportal-service-health
    files:
      - service-health.json
