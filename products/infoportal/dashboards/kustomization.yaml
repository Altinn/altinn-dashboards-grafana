apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
generatorOptions:
  # The GrafanaDashboard CRs reference the ConfigMaps by name, so the names must be stable.
  disableNameSuffixHash: true
resources:
  - service-health.yaml
  - all-environments.yaml
configMapGenerator:
  - name: dashboard-infoportal-service-health
    files:
      - service-health.json
  - name: dashboard-infoportal-all-environments
    files:
      - all-environments.json
