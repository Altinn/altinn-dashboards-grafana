# Hand-authored alert rules (not a Grafana UI export). Unlike rules-exceptions.yaml (Azure Log
# Analytics / App Insights), these query blackbox-exporter `probe_success` over the Prometheus
# datasource `admin-prod-obs-amw`. Keep the `uid`s stable on edits; regenerating one duplicates
# the rule in Grafana.
#
# Since 2026-10-05, KI Norge's front-page probes have been replaced by /health probes. The
# instance labels remain ki.norge.no (PROD) and ki.test.norge.no (TT02), but the jobs now end in
# -health-check. Success requires HTTP 200 and a response body reporting status Healthy.
#
# The job matcher is fully anchored because Azure Managed Prometheus does not anchor `=~`.
#
# `max by (instance)` collapses the blackbox-exporter replicas *and* the two IP families,
# so the alert fires only when no probe reports Healthy. That deliberately does not
# page for an IPv6-only failure; the state-timeline panel on the dashboard breaks the families
# apart if you need to see which one dropped.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: ki-norge-availability
  namespace: grafana
spec:
  name: Availability
  folderRef: external-grafana-ki-norge
  instanceSelector:
    matchLabels:
      dashboards: external-grafana
  interval: 1m
  rules:
  - uid: ki-norge-availability-prod
    title: Availability Prod
    condition: C
    for: 5m
    noDataState: NoData
    execErrState: OK
    labels:
      AlertType: Availability
      Env: Prod
      Product: KI Norge
      Severity: Critical
    annotations:
      summary: KI Norge health check is failing in prod (ki.norge.no)
      description: 'probe_success=0 for {{ $labels.instance }} — the /health probe failed on both IPv4 and IPv6'
      # "Open probe panel" in Slack lands on the KI Norge dashboard's probe state-timeline
      # (panel 6), which splits PROD/TT02 and IPv4/IPv6 so the blast radius is visible.
      __dashboardUid__: ki-norge-health-001
      __panelId__: "6"
    notificationSettings:
      # Fans out to the KI Norge channel AND #altinn-alerts-prod-critical (two Slack
      # receivers on one contact point). TT02 stays on the KI-Norge-only contact point.
      receiver: KI Norge Slack Availability Prod
      # Without this the rule inherits the root policy's 4h repeat_interval and re-posts the same
      # "DOWN" message every 4h for as long as the probe stays red, which reads like repeated
      # independent outages. 24h keeps one daily reminder that a Critical alert is still open.
      # Must be a multiple of the root group_interval (5m); 24h = 288 x 5m. Grafana's max is 120h.
      repeat_interval: 24h
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: admin-prod-obs-amw
      model:
        datasource:
          type: prometheus
          uid: admin-prod-obs-amw
        editorMode: code
        expr: 'max by (instance) (probe_success{job=~"^blackbox-http-ipv[46]-health-check$", instance="ki.norge.no"})'
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
  - uid: ki-norge-availability-tt02
    title: Availability TT02
    condition: C
    for: 10m
    noDataState: NoData
    execErrState: OK
    labels:
      AlertType: Availability
      Env: TT02
      Product: KI Norge
      # Warning rather than Critical: a test environment being down is not a production
      # incident. The longer `for` also rides out routine tt02 redeploys without notifying.
      Severity: Warning
    annotations:
      summary: KI Norge health check is failing in tt02 (ki.test.norge.no)
      description: 'probe_success=0 for {{ $labels.instance }} — the /health probe failed on both IPv4 and IPv6'
      __dashboardUid__: ki-norge-health-001
      __panelId__: "6"
    notificationSettings:
      receiver: KI Norge Slack Availability
      repeat_interval: 24h
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: admin-prod-obs-amw
      model:
        datasource:
          type: prometheus
          uid: admin-prod-obs-amw
        editorMode: code
        expr: 'max by (instance) (probe_success{job=~"^blackbox-http-ipv[46]-health-check$", instance="ki.test.norge.no"})'
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: C
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
