kind: ExternalSecret
metadata:
  name: example-tempo-auth
  namespace: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: grafana-alerting-secret-store
    kind: SecretStore
  target:
    name: example-tempo-auth
    creationPolicy: Owner
  data:
    - secretKey: authorization
      remoteRef:
        key: datasource-example-tempo-authorization
